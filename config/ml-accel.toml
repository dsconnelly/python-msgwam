################################################################################
# global integration settings
################################################################################
mean_state_type = 'prescribed'
propagator_type = 'transient'
source_type = 'packet'
spectrum_type = 'gaussians'

################################################################################
# input and output
################################################################################
average_output = true
prescribed_wind_file = 'data/ml-accel/mean-state.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 120
n_day = 12

################################################################################
# mean state
################################################################################
boussinesq = false
H_rho = 7e3
latitude = 0
n_grid = 101
N_ref = 0.02
rho_ref = 1.2
z_max = 70e3
z_min = 10e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 50
dt_launch = 3600
n_source = 20

################################################################################
# 'transient' propagator
################################################################################
check_sign_changes = false
dr_init = 1000
min_flux = 1e-8
n_chromatic = 1
n_increment = 0
n_max = 5000
prune_by = 'none'
shapiro_filter = true

################################################################################
# 'packet' source
################################################################################
n_repeat = 1

################################################################################
# 'stochastic' source
################################################################################
epsilon = 1

################################################################################
# 'gaussians' spectrum
################################################################################
c_his = [40, -15]
c_los = [15, -40]
c_width = 10
direction = 0
dk_init = 1e-4
dl_init = 1e-4
flux_bc = 3e-3
T_hat_lo = 1
T_hat_hi = 10
tau_corr_days = 0.5
tau_cutoff_hours = 1
seed = 1234
