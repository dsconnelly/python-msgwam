################################################################################
# global integration settings
################################################################################
mean_state_type = 'prescribed'
propagator_type = 'transient'
source_type = 'constant'
spectrum_type = 'from_file'

################################################################################
# input and output
################################################################################
average_output = true
prescribed_mean_file = 'DATA_DIR/input/mean-state.nc'
spectrum_file = 'DATA_DIR/input/spectrum.nc'

################################################################################
# time stepping
################################################################################
dt = 240
dt_output = 240
n_day = 30

################################################################################
# mean state
################################################################################
boussinesq = false
H_N = 15e3
H_rho = 7e3
latitude = 30
n_grid = 401
rho_ref = 1.2
z_max = 60e3
z_min = 5e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 50
dt_launch = -1
extrinsic = true
n_source = 16

################################################################################
# 'transient' propagator
################################################################################
cfl_mode = 'warn'
dr_ghost = 2000
dr_source = 2500
dr_max = 10000
dr_min = 50
jitter = 0
max_age = -1
max_dt_multiplier = 4
max_overshoot = 1.2
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 250
n_sponge = 20
prune_by = 'energy'
r_source = 10e3
shapiro_filter = true

################################################################################
# 'stochastic' source
################################################################################
epsilon = 1

################################################################################
# 'gaussians' spectrum
################################################################################
dk_init = 1e-4
dl_init = 1e-4

################################################################################
# 'mima' spectrum
################################################################################
flux_bc_ex = 0.012
flux_bc_tr = 0.006
cp_width_ex = 35
cp_width_tr = 35
lat_tropics = 25
source_dlat = 5
T_hat_source = 36000
