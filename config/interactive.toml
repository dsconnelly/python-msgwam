################################################################################
# global integration settings
################################################################################
mean_state_type = 'interactive'
propagator_type = 'transient'
source_type = 'constant'
spectrum_type = 'from_file'

################################################################################
# input and output
################################################################################
average_output = true
spectrum_file = 'data/interactive/input/spectrum.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 86400
n_day = 180

################################################################################
# mean state
################################################################################
boussinesq = false
geostrophic = false
H_rho = 8e3
latitude = 5
n_grid = 401
N_ref = 0.02
rho_ref = 1.2
w_star = 0.001
z_max = 70e3
z_min = 10e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 36
dt_launch = -1
extrinsic = false
flux_bc = 10e-3
n_source = 16

################################################################################
# 'transient' propagator
################################################################################
cfl_mode = 'warn'
dr_init = 3000
jitter = false
max_age = -1
max_dt_multiplier = 10
max_overshoot = 1.2
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 250
prune_by = 'energy'
shapiro_filter = true

################################################################################
# 'stochastic' source
################################################################################
epsilon = 1

################################################################################
# 'gaussians' spectrum
################################################################################
c_his = [20, -20]
c_los = [20, -20]
c_width_in = 10
c_width_out = 10
direction = 0
dk_init = 1e-4
dl_init = 1e-4
n_axes = 2
T_hat_lo = 10.5
T_hat_hi = 10.5
tau_corr_days = 6
tau_cutoff_days = 3
seed = 123

################################################################################
# 'desaubies' spectrum
################################################################################
n_omega = 2
n_phi = 4
omega_hat_max = 5e-4
omega_hat_min = 1e-4
wvl_star = 2e3