################################################################################
# global integration settings
################################################################################
mean_state_type = 'interactive'
propagator_type = 'transient'
source_type = 'constant'
spectrum_type = 'mima'

################################################################################
# input and output
################################################################################
average_output = true
# prescribed_wind_file = 'data/idealized/input/descending-jets.nc'
# spectrum_file = 'data/idealized/input/spectrum.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 14400
n_day = 360

################################################################################
# mean state
################################################################################
boussinesq = false
geostrophic = false
H_rho = 7e3
latitude = 28
n_grid = 401
N_ref = 0.02
rho_ref = 1.2
w_star = 0
z_max = 40e3
z_min = 10e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 50
dt_launch = -1
extrinsic = true
# flux_bc = 3e-3
n_source = 16

################################################################################
# 'transient' propagator
################################################################################
cfl_mode = 'warn'
dr_init = 2500
jitter = false
max_age = -1
max_dt_multiplier = 10
max_overshoot = 1.2
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 2500
prune_by = 'energy'
shapiro_filter = true

################################################################################
# 'stochastic' source
################################################################################
epsilon = 1

################################################################################
# 'gaussians' spectrum
################################################################################
# c_his = [45, -5]
# c_los = [5, -45]
# c_width_in = 10
# c_width_out = 10
# direction = 0
dk_init = 1e-4
dl_init = 1e-4
# n_axes = 1
# T_hat_lo = 1
# T_hat_hi = 6
# tau_corr_days = 6
# tau_cutoff_days = 3
# seed = 123

################################################################################
# 'mima' spectrum
################################################################################
flux_bc_ex = 0.010
flux_bc_tr = 0.006
cp_width_ex = 35
cp_width_tr = 20
lat_tropics = 25
source_dlat = 5
T_hat_source = 21600
