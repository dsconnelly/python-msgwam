################################################################################
# global integration settings
################################################################################
mean_state_type = 'prescribed'
propagator_type = 'transient'
source_type = 'deterministic'
spectrum_type = 'gaussians'

################################################################################
# input and output
################################################################################
average_output = true
prescribed_wind_file = 'data/gaussians/mean-state.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 120
n_day = 12

################################################################################
# mean state
################################################################################
boussinesq = false
H_rho = 7e3
latitude = 0
n_grid = 101
N_ref = 0.02
rho_ref = 1.2
z_max = 70e3
z_min = 10e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 50
n_source = 50

################################################################################
# 'transient' propagator
################################################################################
check_sign_changes = false
dr_init = 1000
epsilon = 1
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 6000
prune_by = 'energy'
shapiro_filter = true

################################################################################
# 'gaussians' spectrum
################################################################################
c_his = [35, -15]
c_los = [15, -35]
c_width = 10
direction = 0
dk_init = 1e-4
dl_init = 1e-4
flux_bc = 3e-3
T_hat_lo = 1
T_hat_hi = 8
tau_corr_days = 2
tau_cutoff_hours = 24
seed = 1234
