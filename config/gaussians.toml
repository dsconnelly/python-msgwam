################################################################################
# global integration settings
################################################################################
mean_state_type = 'prescribed'
propagator_type = 'transient'
source_type = 'deterministic'
spectrum_type = 'gaussians'

################################################################################
# input and output
################################################################################
average_output = true
prescribed_wind_file = 'data/gaussians/mean-state.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 120
n_day = 10

################################################################################
# mean state
################################################################################
boussinesq = false
H_rho = 7e3
latitude = 0
n_grid = 101
N_ref = 0.02
rho_ref = 1.2
z_max = 70e3
z_min = 10e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 50
n_source = 50

################################################################################
# 'transient' propagator
################################################################################
check_sign_changes = false
dr_init = 2000
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 250
prune_by = 'energy'
shapiro_filter = true

################################################################################
# 'gaussians' spectrum
################################################################################
flux_bc = 3e-3
c_center = 20
c_width = 12
dk_init = 1e-4
direction = 0
dl_init = 1e-4
period_hours = 3