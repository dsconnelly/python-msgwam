################################################################################
# global integration settings
################################################################################
mean_state_type = 'prescribed'
propagator_type = 'transient'
source_type = 'constant'
spectrum_type = 'from_file'

################################################################################
# input and output
################################################################################
average_output = true
prescribed_wind_file = 'data/icon-midlatitudes/input/mean-state.nc'
spectrum_file = 'data/icon-midlatitudes/input/spectrum.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 120
n_day = 30

################################################################################
# mean state
################################################################################
boussinesq = false
H_rho = 7e3
latitude = 60
n_grid = 401
N_ref = 0.02
rho_ref = 1.2
z_max = 100e3
z_min = 40e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 75
dt_launch = -1
flux_bc = 3e-3
n_source = 16

################################################################################
# 'transient' propagator
################################################################################
cfl_mode = 'warn'
dr_init = 2500
jitter = false
max_age = -1
max_dt_multiplier = 10
max_overshoot = 1.2
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 250
prune_by = 'energy'
shapiro_filter = true

################################################################################
# 'stochastic' source
################################################################################
epsilon = 1

################################################################################
# 'gaussians' spectrum
################################################################################
c_his = [55, -20]
c_los = [20, -55]
c_width = 20
direction = 0
dk_init = 1e-4
dl_init = 1e-4
T_hat_lo = 1
T_hat_hi = 6
tau_corr_days = 6
tau_cutoff_days = 3
seed = 123