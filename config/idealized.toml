################################################################################
# global integration settings
################################################################################
mean_state_type = 'prescribed'
propagator_type = 'transient'
source_type = 'constant'
spectrum_type = 'from_file'

################################################################################
# input and output
################################################################################
average_output = true
prescribed_mean_file = 'data/idealized/input/mean-state.nc'
spectrum_file = 'data/idealized/input/spectrum.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 120
n_day = 30

################################################################################
# mean state
################################################################################
boussinesq = false
H_N = 15e3
H_rho = 7e3
latitude = 30
n_grid = 401
N_ref_max = 0.02
N_ref_min = 0.01
N_ref_noise = 0.0015
rho_ref = 1.2
z_max = 60e3
z_min = 10e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 50
dt_launch = -1
extrinsic = true
flux_bc = 5e-3
n_source = 8

################################################################################
# 'transient' propagator
################################################################################
cfl_mode = 'warn'
dr_init = 3500
dr_max = 10000
dr_min = 50
jitter = false
max_age = -1
max_dt_multiplier = 10
max_overshoot = 1.2
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 125
prune_by = 'energy'
shapiro_filter = true

################################################################################
# 'stochastic' source
################################################################################
epsilon = 1

################################################################################
# 'gaussians' spectrum
################################################################################
c_his = [0]
c_los = [0]
c_width_in = 40
c_width_out = 40
direction = 0
dk_init = 1e-4
dl_init = 1e-4
n_axes = 1
T_hat_lo = 3
T_hat_hi = 18
tau_corr_days = 3
tau_cutoff_days = 1
seed = 123