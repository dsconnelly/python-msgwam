################################################################################
# global integration settings
################################################################################
mean_state_type = 'prescribed'
propagator_type = 'transient'
source_type = 'constant'
spectrum_type = 'from_file'

################################################################################
# input and output
################################################################################
average_output = true
prescribed_wind_file = 'data/idealized/input/descending-jets.nc'
spectrum_file = 'data/idealized/input/spectrum.nc'

################################################################################
# time stepping
################################################################################
dt = 120
dt_output = 120
n_day = 30

################################################################################
# mean state
################################################################################
boussinesq = false
H_rho = 7e3
latitude = 0
n_grid = 401
N_ref = 0.02
rho_ref = 1.2
z_max = 70e3
z_min = 10e3

################################################################################
# viscosity and dissipation
################################################################################
dissipation = 1
mu = 1e-3

################################################################################
# gravity wave source and spectrum
################################################################################
c_max = 50
dt_launch = -1
n_source = 12

################################################################################
# 'transient' propagator
################################################################################
cfl_mode = 'warn'
check_sign_changes = false
dr_init = 4000
jitter = false
max_age = -1
max_cells_per_dt = 1
max_dr_overshoot = 1.2
min_flux = 1e-8
n_chromatic = -1
n_increment = 0
n_max = 250
prune_by = 'energy'
shapiro_filter = true

################################################################################
# 'stochastic' source
################################################################################
epsilon = 1

################################################################################
# 'desaubies' spectrum
################################################################################
n_omega = 2
omega_hat_max = 5e-4
omega_hat_min = 1e-4
wvl_star = 2e3
